# Example GitHub Actions snippet for hardening release artifacts with AEGIS
name: Harden Build with AEGIS Blue Shield
on:
  workflow_dispatch:

env:
  # Pinned to the AEGIS release you audited. Bump together with package.json.
  # Never use the mutable `latest` tag in a release pipeline.
  AEGIS_VERSION: "2.1.0"

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx -y "aegis-agents@${AEGIS_VERSION}" defend ./dist -o ./dist-shielded --manifest